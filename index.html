<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Financeiro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <div class="container">

    <div class="resumo-financeiro">
      <h1 class="titulo-principal">Dashboard - Financeiro</h1>
      <div class="resumo-card resumo-receitas">
        <h2 class="titulo-card titulo-receitas">Total Receitas:
        </h2>
        <p class="valor-card valor-receita"></p>
      </div>
      <div class="resumo-card resumo-despesa">
        <h2 class="titulo-card titulo-despesa">Total Despesas:
        </h2>
        <p class="valor-card valor-despesa"></p>
      </div>

      <div class="resumo-card resumo-saldo">
        <h2 class="titulo-card titulo-saldo">Total Saldo:
        </h2>
        <p class="valor-card valor-total"></p>
      </div>

    </div>
    <h2 class="titulo-secao">Nova Transação</h2>
    <form>

      <div class="campo-form" <label for="descricao">Nome da transação:</label>
        <input type="text" id="descricao" name="descricao">
      </div>
      <div class="campo-form"><label for="valor">Valor:</label>
        <input type="number" step="0.01" id="valor" name="valor">
      </div>
      <div class="campo-form"> <label for="tipo-transacao">Tipo:</label>
        <select name="tipo-transacao" id="tipo-transacao">
          <option value="receita">Receita</option>
          <option value="despesa">Despesa</option>
        </select>
      </div>
      <div class="campo-form">
        <label for="categoria-transacao">Categoria:</label>
        <select name="categoria-transacao" id="categoria-transacao">

        </select>
      </div>

      <div class="campo-form"><label for="data">Data:</label>
        <input type="date" id="data" name="data">
      </div>


      <button type="submit" class="btn-enviar">Enviar</button>
      <span class="error-mensagem">Erro ao cadastrar nova transação! Preencha todos os dados corretamente!</span>
    </form>
    <h2 class="titulo-secao">Filtros</h2>
    <div class="filtros-transacao">
      <div class="campo-filtro">
        <label for="filtro-tipo-transacao">Filtrar por:</label>
        <select name="filtro-tipo-transacao" id="filtro-tipo-transacao">
          <option value="todos">Todos</option>
          <option value="receita">Receita</option>
          <option value="despesa">Despesa</option>
        </select>
      </div>
      <div class="campo-filtro">
        <label for="filtro-categoria-transacao">Categoria:</label>
        <select name="filtro-categoria-transacao" id="filtro-categoria-transacao">
        </select>
      </div>
      <div class="campo-filtro">
        <label for="filtro-data">Data:</label>
        <input type="date" id="filtro-data" name="filtro-data">
      </div>
      <button type="button" class="limpar-filtros">Limpar filtros</button>
    </div>

    <h2 class="titulo-secao">Histórico de Transações</h2>
    <div class="dashboard-conteudo">
      <div class="historico-transacao">

        <ul class="transacao-lista"></ul>
      </div>

      <div class="grafico">
        <div class="grafico-card">
          <h3 class="titulo-card">Receitas x Despesas</h3>
          <canvas id="financial-chart"></canvas>
        </div>
        <div class="grafico-card">
          <h3 class="titulo-card">Receitas por Categoria</h3>
          <canvas id="revenues-category-chart"></canvas>
        </div>
        <div class="grafico-card">
          <h3 class="titulo-card">Despesas por Categoria</h3>
          <canvas id="expenses-category-chart"></canvas>
        </div>

      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./js/script.js"></script>

</body>

</html>
