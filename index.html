<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Financeiro</title>
</head>

<body>

  <div class="container">
    <h1>Dashboard - Financeiro</h1>
    <div class="resumo-financeiro">
      <div class="resumo-despesa">
        <h2 class="titulo-despesa">Total Despesas:
        </h2>
        <p class="valor-despesa"></p>
      </div>
      <div class="resumo-receitas">
        <h2 class="titulo-receitas">Total Receitas:
        </h2>
        <p class="valor-receita"></p>
      </div>
      <div class="resumo-saldo">
        <h2 class="titulo-saldo">Total Saldo:
        </h2>
        <p class="valor-total"></p>
      </div>

    </div>
    <form>
      <label for="descricao">Nome da transação:</label>
      <input type="text" id="descricao" name="descricao">
      <label for="valor">Valor:</label>
      <input type="number" step="0.01" id="valor" name="valor">
      <label for="tipo-transacao">Tipo:</label>
      <select name="tipo-transacao" id="tipo-transacao">
        <option value="receita">Receita</option>
        <option value="despesa">Despesa</option>
      </select>
      <label for="categoria-transacao">Categoria:</label>
      <select name="categoria-transacao" id="categoria-transacao">

      </select>

      <label for="data">Data:</label>
      <input type="date" id="data" name="data">
      <button type="submit">Enviar</button>
    </form>

    <div class="filtros-transacao">
      <label for="filtro-tipo-transacao">Filtrar por:</label>
      <select name="filtro-tipo-transacao" id="filtro-tipo-transacao">
        <option value="todos">Todos</option>
        <option value="receita">Receita</option>
        <option value="despesa">Despesa</option>
      </select>
      <label for="filtro-categoria-transacao">Categoria:</label>
      <select name="filtro-categoria-transacao" id="filtro-categoria-transacao">
      </select>
      <label for="filtro-data">Data:</label>
      <input type="date" id="filtro-data" name="filtro-data">
      <button type="button" class="limpar-filtros">Limpar filtros</button>
    </div>

    <div class="historico-transacao">
      <h2 class="titulo-historico">Histórico de Transações</h2>
      <ul class="transacao-lista"></ul>
    </div>

    <div class="grafico">
      <canvas id="financial-chart"></canvas>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./js/script.js"></script>

</body>

</html>
